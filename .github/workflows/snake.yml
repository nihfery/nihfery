name: Generate contribution snake

on:
  schedule:
    # Refresh every 6 hours, away from the top-of-hour Actions traffic spike.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate animated contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nihfery
          # A fine-grained PAT lets the graph include selected private repositories.
          # The built-in token remains a safe fallback when the secret is not configured.
          github_token: ${{ secrets.SNAKE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
