<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fery — Digital Builder</title>
  <desc id="desc">An animated dark aurora banner introducing Fery as a developer and designer.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A12"/>
      <stop offset="0.48" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#080B14"/>
    </linearGradient>

    <linearGradient id="accent" x1="126" y1="0" x2="570" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.48" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.52"/>
      <stop offset="0.5" stop-color="#334155" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.45"/>
    </linearGradient>

    <radialGradient id="violetGlow">
      <stop stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow">
      <stop stop-color="#0891B2" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.34"/>
    </filter>

    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="358" rx="26"/>
    </clipPath>
  </defs>

  <style>
    .eyebrow {
      font: 600 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 3px;
    }

    .headline {
      font: 700 58px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -2.6px;
    }

    .body {
      font: 400 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .label {
      font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 1.2px;
    }

    .chip {
      font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .reveal {
      opacity: 0;
      animation: reveal 0.85s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .delay-1 { animation-delay: 0.12s; }
    .delay-2 { animation-delay: 0.26s; }
    .delay-3 { animation-delay: 0.42s; }
    .delay-4 { animation-delay: 0.58s; }

    .float-a { animation: floatA 5s ease-in-out infinite; }
    .float-b { animation: floatB 6s ease-in-out infinite; }
    .float-c { animation: floatC 5.5s ease-in-out infinite; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    .scan { animation: scan 4.5s ease-in-out infinite; }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatA {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(0, -8px); }
    }

    @keyframes floatB {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(8px, 4px); }
    }

    @keyframes floatC {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-6px, -5px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }

    @keyframes scan {
      0% { transform: translateX(-380px); opacity: 0; }
      20%, 70% { opacity: .75; }
      100% { transform: translateX(920px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal, .float-a, .float-b, .float-c, .pulse, .scan {
        animation: none;
        opacity: 1;
      }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <circle cx="840" cy="28" r="260" fill="url(#violetGlow)" filter="url(#blur)">
      <animate attributeName="cx" values="840;900;840" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="28;54;28" dur="7s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1078" cy="318" r="230" fill="url(#cyanGlow)" filter="url(#blur)">
      <animate attributeName="cx" values="1078;1018;1078" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="318;286;318" dur="8s" repeatCount="indefinite"/>
    </circle>

    <g opacity="0.75">
      <path d="M-220 319H1420" stroke="url(#accent)" stroke-opacity="0.1"/>
      <rect class="scan" x="-280" y="318" width="330" height="1" fill="url(#accent)"/>
    </g>

    <g transform="translate(72 62)">
      <g class="reveal">
        <rect width="226" height="31" rx="15.5" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <circle class="pulse" cx="17" cy="15.5" r="4" fill="#34D399"/>
        <text x="31" y="20" class="eyebrow" fill="#CBD5E1">FERY / DIGITAL BUILDER</text>
      </g>

      <text x="0" y="104" class="headline reveal delay-1" fill="#F8FAFC">Designing systems.</text>
      <text x="0" y="170" class="headline reveal delay-2" fill="url(#accent)">Shipping ideas.</text>
      <text x="2" y="217" class="body reveal delay-3" fill="#94A3B8">Developer × designer crafting thoughtful digital experiences.</text>

      <g transform="translate(2 252)">
        <g class="reveal delay-4">
          <circle cx="5" cy="5" r="5" fill="#22D3EE"/>
          <text x="21" y="10" class="label" fill="#CBD5E1">TELKOM UNIVERSITY · INDONESIA</text>
        </g>
      </g>
    </g>

    <g transform="translate(788 56)" filter="url(#shadow)">
      <rect width="338" height="248" rx="23" fill="#111827" fill-opacity="0.72" stroke="url(#border)"/>
      <rect x="1" y="1" width="336" height="246" rx="22" fill="url(#grid)" opacity="0.55"/>

      <g transform="translate(25 25)">
        <text class="label" fill="#64748B" x="0" y="12">CURRENT FOCUS</text>
        <circle cx="278" cy="7" r="3.5" fill="#34D399" class="pulse"/>
      </g>

      <g transform="translate(25 62)">
        <g class="float-a">
          <rect width="286" height="42" rx="11" fill="#FFFFFF" fill-opacity="0.055" stroke="#A78BFA" stroke-opacity="0.24"/>
          <rect x="12" y="11" width="38" height="20" rx="6" fill="#7C3AED" fill-opacity="0.22"/>
          <text x="19" y="25" class="label" fill="#C4B5FD">TS</text>
          <text x="64" y="26" class="chip" fill="#E2E8F0">Type-safe web products</text>
        </g>
      </g>

      <g transform="translate(25 116)">
        <g class="float-b">
          <rect width="286" height="42" rx="11" fill="#FFFFFF" fill-opacity="0.055" stroke="#818CF8" stroke-opacity="0.22"/>
          <rect x="12" y="11" width="38" height="20" rx="6" fill="#4F46E5" fill-opacity="0.22"/>
          <text x="18" y="25" class="label" fill="#A5B4FC">UX</text>
          <text x="64" y="26" class="chip" fill="#E2E8F0">Intentional interfaces</text>
        </g>
      </g>

      <g transform="translate(25 170)">
        <g class="float-c">
          <rect width="286" height="42" rx="11" fill="#FFFFFF" fill-opacity="0.055" stroke="#22D3EE" stroke-opacity="0.2"/>
          <rect x="12" y="11" width="38" height="20" rx="6" fill="#0891B2" fill-opacity="0.22"/>
          <text x="18" y="25" class="label" fill="#67E8F9">W3</text>
          <text x="64" y="26" class="chip" fill="#E2E8F0">Decentralized technology</text>
        </g>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="26" stroke="url(#border)" stroke-opacity="0.72"/>
</svg>
