<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fery — Developer and Designer</title>
  <desc id="desc">A minimal animated profile banner for Fery.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090B"/>
      <stop offset="1" stop-color="#111116"/>
    </linearGradient>

    <linearGradient id="accent" x1="72" y1="0" x2="535" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.52" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#A78BFA"/>
      <stop offset="0.62" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop stop-color="#7C3AED" stop-opacity="0.24"/>
      <stop offset="0.52" stop-color="#312E81" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="298" rx="24"/>
    </clipPath>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <style>
    .overline {
      font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 2.8px;
    }

    .name {
      font: 720 78px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -4px;
    }

    .subtitle {
      font: 400 19px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .meta {
      font: 500 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 1.6px;
    }

    .fade {
      opacity: 0;
      animation: fade 0.8s ease-out forwards;
    }

    .delay-1 { animation-delay: 0.12s; }
    .delay-2 { animation-delay: 0.24s; }
    .delay-3 { animation-delay: 0.4s; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .drift { animation: drift 10s ease-in-out infinite; }
    .shimmer { animation: shimmer 5s ease-in-out infinite; }

    @keyframes fade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-42px, 18px); }
    }

    @keyframes shimmer {
      0% { transform: translateX(-700px); opacity: 0; }
      22%, 64% { opacity: 0.62; }
      100% { transform: translateX(700px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade, .pulse, .drift, .shimmer {
        animation: none;
        opacity: 1;
      }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#background)"/>

    <g transform="translate(990 38)">
      <circle class="drift" cx="0" cy="0" r="270" fill="url(#glow)" filter="url(#blur)"/>
    </g>

    <g transform="translate(72 54)">
      <g class="fade">
        <circle class="pulse" cx="5" cy="5" r="5" fill="#34D399"/>
        <text x="20" y="10" class="overline" fill="#A1A1AA">AVAILABLE TO COLLABORATE</text>
      </g>

      <text x="0" y="103" class="name fade delay-1" fill="#FAFAFA">Fery<tspan fill="url(#accent)">.</tspan></text>
      <text x="3" y="148" class="subtitle fade delay-2" fill="#A1A1AA">Developer · Designer · Curious Mind</text>
    </g>

    <g transform="translate(870 207)">
      <g class="fade delay-3">
        <text x="0" y="0" class="meta" fill="#71717A">BASED IN</text>
        <text x="0" y="25" class="meta" fill="#E4E4E7">INDONESIA</text>
        <rect x="116" y="-12" width="1" height="48" fill="#3F3F46"/>
        <text x="142" y="0" class="meta" fill="#71717A">FOCUS</text>
        <text x="142" y="25" class="meta" fill="#E4E4E7">WEB · DESIGN · WEB3</text>
      </g>
    </g>

    <rect x="0" y="298" width="1200" height="2" fill="#27272A"/>
    <rect class="shimmer" x="350" y="298" width="500" height="2" fill="url(#line)"/>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="24" stroke="#FFFFFF" stroke-opacity="0.1"/>
</svg>
